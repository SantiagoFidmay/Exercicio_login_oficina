<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/styles_cad.css">
    <script src="../js/atualizar_agendamento.js" defer></script>
    <title>Atualizar Agendamento</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Atualizar Agendamento</h1><br>
        
        <form>
            <label for="data">Data</label>
        <input type="date" id="data"><br><br>

        <label for="hora">Hora</label>
        <input type="time" id="hora"><br><br>

        <label for="tipo">Tipo:</label><br>
            <select id="tipo">
                <option value="REVISAO">REVISAO</option>
                <option value="MANUTENCAO">MANUTENCAO</option>
                <option value="INSTALACAO">INSTALACAO</option>
            </select><br><br>

        <label for="idVeiculo">ID do Veiculo</label>
        <input type="text" id="idVeiculo"><br><br>

        <label for="idCliente">ID do Cliente</label>
        <input type="text" id="idCliente"><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <br><br>
        <div id="resposta"></div>
    </main>
</body>
</html>
