<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

<body>
    <header>

    <main>

        <h1>Cadastrar Agendamento</h1>

        <label for="data">Data</label>
        <input type="date" id="data"><br><br>

        <label for="hora">Hora</label>
        <input type="time" id="hora"><br><br>

        <label for="tipo">Tipo:</label><br>

                <option value="MANUTENCAO">MANUTENCAO</option>
                <option value="INSTALACAO">INSTALACAO</option>
            </select><br><br>

        <label for="idVeiculo">ID do Veiculo</label>
        <input type="text" id="idVeiculo"><br><br>

        <label for="idCliente">ID do Cliente</label>
        <input type="text" id="idCliente"><br><br>

     

        <button id="btn_cadastrar_agendamento">Cadastrar</button>

        <div id="resposta"></div>

    </main>
