<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/atualizar_cliente.js" defer></script>
    <title>Atualizar Cliente</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;
        </nav>
    </header>
    <main>
        <h1>Atualizar Cliente</h1><br>
        <form>
            <label for="codCliente">Código:</label><br>
            <input type="text" id="codCliente"><br><br>

            <label for="nome">Nome:</label><br>
            <input type="text" id="nome"><br><br>

            <label for="email">Email:</label><br>
            <input type="text" id="email"><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha"><br><br>

            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf"><br><br>

            <label for="endereco">Endereço:</label><br>
            <input type="text" id="endereco"><br><br>

            <label for="celular">Celular:</label><br>
            <input type="text" id="celular"><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <br><br>
        <div id="resposta"></div>
    </main>
</body>
</html>
